version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: safepath_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=guardian_checkin
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d/
    networks:
      - safepath_network

networks:
  safepath_network:
    driver: bridge