version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: etheria_db
    restart: always
    environment:
      POSTGRES_USER: etheria
      POSTGRES_PASSWORD: etheria123
      POSTGRES_DB: etheria_global_db
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_etheria/init_etheria.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - holding_network
    # Verifica que Postgres esté listo para recibir consultas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etheria -d etheria_global_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  dynamic_db:
    image: mysql:8.0
    container_name: dynamic_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: brands_sql
      MYSQL_DATABASE: dynamic_brands_db
      MYSQL_USER: dynamic
      MYSQL_PASSWORD: brands123
    ports:
      - "3307:3306"
    volumes:
      - ./mysql_dynamic/init_dynamic.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - holding_network
    # Verifica que MySQL esté listo para recibir consultas
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u dynamic --password=brands123"]
      interval: 5s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    container_name: metabase_etheria
    restart: always
    ports:
      - "3000:3000"
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
    volumes:
      - ./metabase-data:/metabase-data
    networks:
      - holding_network
    depends_on:
      db:
        condition: service_healthy
      dynamic_db:
        condition: service_healthy

  # Servicio de ETL Automatizado
  etl_process:
    build:
      context: ./script etl  # Ruta a la carpeta que contiene el Dockerfile y ETL.py
    container_name: etl_worker
    networks:
      - holding_network
    depends_on:
      db:
        condition: service_healthy
      dynamic_db:
        condition: service_healthy

networks:
  holding_network:
    driver: bridge